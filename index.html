        function switchLlamadaTab(tabId, btnElement) {
            const tabs = document.querySelectorAll('#llamada-content-container > .tab-content');
            tabs.forEach(tab => {
                tab.classList.remove('block');
                tab.classList.add('hidden');
            });
            const btns = document.querySelectorAll('#llamada-sidebar-menu .internal-nav-btn');
            btns.forEach(btn => {
                btn.classList.remove('active');
            });
            const target = document.getElementById(tabId);
            if (target) {
                target.classList.remove('hidden');
                target.classList.add('block');
            }
            if (btnElement) {
                btnElement.classList.add('active');
            }
        }

        function switchLlamadaSubTab(containerId, subTabId, btnElement) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const subTabs = container.querySelectorAll('.sub-tab-content');
            subTabs.forEach(t => {
                t.classList.add('hidden');
                t.classList.remove('block');
            });
            const btns = container.querySelectorAll('.sub-nav-btn');
            btns.forEach(b => {
                b.classList.remove('border-pf-red', 'bg-red-50', 'text-pf-red', 'shadow-sm', 'ring-1', 'ring-pf-red');
                b.classList.add('border-gray-200', 'bg-white', 'text-gray-700');
            });
            const target = document.getElementById(subTabId);
            if (target) {
                target.classList.remove('hidden');
                target.classList.add('block');
            }
            if (btnElement) {
                btnElement.classList.remove('border-gray-200', 'bg-white', 'text-gray-700');
                btnElement.classList.add('border-pf-red', 'bg-red-50', 'text-pf-red', 'shadow-sm', 'ring-1', 'ring-pf-red');
            }
        }

        function selectBajaStep1(val, btn) {

            document.querySelectorAll('.baja-btn-1').forEach(b => b.classList.remove('border-pf-red', 'bg-red-50', 'ring-2', 'ring-pf-red', 'border-gray-500', 'bg-gray-100', 'ring-gray-400'));

            if (val === 'si') {

                btn.classList.add('border-pf-red', 'bg-red-50', 'ring-2', 'ring-pf-red');

                document.getElementById('baja-branch-no-titular')?.classList.add('hidden');

                document.getElementById('baja-step-2')?.classList.remove('hidden');

                document.getElementById('baja-step-2')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } else {

                btn.classList.add('border-gray-500', 'bg-gray-100', 'ring-2', 'ring-gray-400');

                document.getElementById('baja-branch-no-titular')?.classList.remove('hidden');

                document.getElementById('baja-step-2')?.classList.add('hidden');

                hideBajaDownstream(2);

                document.getElementById('baja-branch-no-titular')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            }

        }



        function selectBajaStep2(val, btn) {
            document.querySelectorAll('.baja-btn-2').forEach(b => b.classList.remove('border-pf-red', 'bg-red-50', 'ring-2', 'ring-pf-red'));
            btn.classList.add('border-pf-red', 'bg-red-50', 'ring-2', 'ring-pf-red');
            
            hideBajaDownstream(3);

            if (val === 'multi') {
                document.getElementById('baja-multi-notice')?.classList.remove('hidden');
                document.getElementById('baja-token-notice')?.classList.add('hidden');
                document.getElementById('baja-step-3-single')?.classList.add('hidden');
                document.getElementById('baja-step-3-multi')?.classList.remove('hidden');
            } else {
                document.getElementById('baja-multi-notice')?.classList.add('hidden');
                document.getElementById('baja-token-notice')?.classList.remove('hidden');
                document.getElementById('baja-step-3-multi')?.classList.add('hidden');
                document.getElementById('baja-step-3-single')?.classList.remove('hidden');
            }
            document.getElementById('baja-step-3')?.classList.remove('hidden');
            document.getElementById('baja-step-3')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }



        function selectBajaStep3(val, btn) {

            document.querySelectorAll('.baja-btn-3').forEach(b => b.classList.remove('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400', 'border-red-500', 'bg-red-50', 'ring-red-400'));

            if (val === 'correcta') {

                btn.classList.add('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400');

                document.getElementById('baja-branch-falla-dir')?.classList.add('hidden');

                document.getElementById('baja-step-4')?.classList.remove('hidden');

                document.getElementById('baja-step-4')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } else {

                btn.classList.add('border-red-500', 'bg-red-50', 'ring-2', 'ring-red-400');

                document.getElementById('baja-branch-falla-dir')?.classList.remove('hidden');

                document.getElementById('baja-step-4')?.classList.add('hidden');

                hideBajaDownstream(4);

                document.getElementById('baja-branch-falla-dir')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            }

        }



        function selectBajaStep4(val, btn) {

            document.querySelectorAll('.baja-btn-4').forEach(b => b.classList.remove('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400', 'border-red-500', 'bg-red-50', 'ring-red-400'));

        function hideBajaDownstream(fromStep) {

            if (fromStep <= 2) {

                document.getElementById('baja-step-2')?.classList.add('hidden');

                document.getElementById('baja-token-notice')?.classList.add('hidden');

                document.getElementById('baja-multi-notice')?.classList.add('hidden');

                document.querySelectorAll('.baja-btn-2').forEach(b => b.classList.remove('border-pf-red', 'bg-red-50', 'ring-2', 'ring-pf-red'));

            }

            if (fromStep <= 3) {

                document.getElementById('baja-step-3')?.classList.add('hidden');

                document.getElementById('baja-step-3-single')?.classList.add('hidden');

                document.getElementById('baja-step-3-multi')?.classList.add('hidden');

                document.getElementById('baja-branch-falla-dir')?.classList.add('hidden');

                document.querySelectorAll('.baja-btn-3').forEach(b => b.classList.remove('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400', 'border-red-500', 'bg-red-50', 'ring-red-400'));

            }

            if (fromStep <= 4) {

                document.getElementById('baja-step-4')?.classList.add('hidden');

                document.getElementById('baja-branch-retencion-si')?.classList.add('hidden');

                document.querySelectorAll('.baja-btn-4').forEach(b => b.classList.remove('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400', 'border-red-500', 'bg-red-50', 'ring-red-400'));

            }

            if (fromStep <= 5) {

                document.getElementById('baja-step-5')?.classList.add('hidden');

                document.getElementById('baja-branch-token-fallo')?.classList.add('hidden');

                document.querySelectorAll('.baja-btn-5').forEach(b => b.classList.remove('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400', 'border-red-500', 'bg-red-50', 'ring-red-400'));

            }

            if (fromStep <= 6) {

                document.getElementById('baja-step-6')?.classList.add('hidden');

                document.getElementById('baja-branch-transf-si')?.classList.add('hidden');

                document.getElementById('baja-branch-transf-no')?.classList.add('hidden');

                document.querySelectorAll('.baja-btn-6').forEach(b => b.classList.remove('border-green-500', 'bg-green-50', 'ring-2', 'ring-green-400', 'border-red-500', 'bg-red-50', 'ring-red-400'));

            }

        }



        function resetBajaTree() {

            hideBajaDownstream(2);

            document.getElementById('baja-branch-no-titular')?.classList.add('hidden');

            document.querySelectorAll('.baja-btn-1').forEach(b => b.classList.remove('border-pf-red', 'bg-red-50', 'ring-2', 'ring-pf-red', 'border-gray-500', 'bg-gray-100', 'ring-2', 'ring-gray-400'));

            document.getElementById('baja-step-1')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        function switchBajaDia(dia, btn) {

            document.querySelectorAll('.baja-dia-btn').forEach(b => {

                b.classList.remove('bg-white', 'text-gray-900', 'shadow-xs');

                b.classList.add('text-gray-600');

            });

            btn.classList.add('bg-white', 'text-gray-900', 'shadow-xs');

            btn.classList.remove('text-gray-600');

            if (dia === 'semana') {

                document.getElementById('baja-dia-semana')?.classList.remove('hidden');

                document.getElementById('baja-dia-domingo')?.classList.add('hidden');

            } else {

                document.getElementById('baja-dia-domingo')?.classList.remove('hidden');

                document.getElementById('baja-dia-semana')?.classList.add('hidden');

        // Modal Logic

        function openModal(title, contentHtml) {

            document.getElementById('globalModalTitle').innerHTML = title;

            document.getElementById('globalModalContent').innerHTML = contentHtml;

            const modal = document.getElementById('globalModal');

            modal.classList.remove('hidden');

            // Trigger animation

            setTimeout(() => {

                modal.classList.remove('opacity-0');

                modal.firstElementChild.classList.remove('scale-95');

                modal.firstElementChild.classList.add('scale-100');

            }, 10);

            

            document.addEventListener('keydown', handleEsc);

        }



        function closeModal() {

            const modal = document.getElementById('globalModal');

            modal.classList.add('opacity-0');

            modal.firstElementChild.classList.remove('scale-100');

            modal.firstElementChild.classList.add('scale-95');

            setTimeout(() => {

                modal.classList.add('hidden');

            }, 300);

            document.removeEventListener('keydown', handleEsc);

        }

        

        function handleEsc(e) {

            if (e.key === 'Escape') closeModal();

        }



    
        // --- IMAGE LIGHTBOX VIEWER LOGIC ---
        function openImageLightbox(imageSrc, title, subtitle) {
            const modal = document.getElementById('imageLightboxModal');
            const img = document.getElementById('lightboxImage');
            const titleEl = document.getElementById('lightboxImageTitle');
            const subEl = document.getElementById('lightboxImageSubtitle');
            const newTabBtn = document.getElementById('lightboxNewTabBtn');
            const inner = document.getElementById('lightboxInnerContainer');

            if (!modal || !img) return;

            img.src = imageSrc;
            img.alt = title || 'Documento Ampliado';
            if (titleEl) {
                titleEl.innerHTML = `<i class="ph-fill ph-file-image text-pf-red"></i> <span>${title || 'Visor de Documento'}</span>`;
            }
            if (subEl) {
                if (subtitle) {
                    subEl.textContent = subtitle;
                    subEl.classList.remove('hidden');
                } else {
                    subEl.classList.add('hidden');
                }
            }
            if (newTabBtn) newTabBtn.href = imageSrc;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                modal.classList.remove('opacity-0');
                if (inner) {
                    inner.classList.remove('scale-95');
                    inner.classList.add('scale-100');
                }
            }, 10);

            document.addEventListener('keydown', handleLightboxEsc);
        }

        function closeImageLightbox() {
            const modal = document.getElementById('imageLightboxModal');
            const inner = document.getElementById('lightboxInnerContainer');
            if (!modal || modal.classList.contains('hidden')) return;

            modal.classList.add('opacity-0');
            if (inner) {
                inner.classList.remove('scale-100');
                inner.classList.add('scale-95');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);

            document.removeEventListener('keydown', handleLightboxEsc);
        }

                                <button onclick="copySpeechText('speech-ont', this)" class="text-xs text-gray-500 hover:text-pf-red font-semibold flex items-center gap-1 bg-gray-50 hover:bg-red-50 px-2.5 py-1 rounded-lg transition-colors">
                                    <i class="ph ph-copy"></i> Copiar
                                </button>
                            </div>
                            <p id="speech-ont" class="text-xs sm:text-sm text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100 font-mono">
                                "Registramos la solicitud de cambio de equipo ONT. Costo: S/ 220 [o S/ 110 con 50% dscto; exonerado si presenta denuncia policial por robo]. Fraccionamiento en [1, 2, 5, 8 o 10] cuotas sin intereses. Plazo: 24 horas. ¿Está de acuerdo?"
                            </p>
                        </div>

                        <!-- Patch Cord -->
                        <div class="border border-gray-200 rounded-2xl p-4 bg-white shadow-sm space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 bg-emerald-100 text-emerald-700 font-bold text-xs rounded-full">CAMBIO DE PATCH CORD (JUMPER)</span>
                                <button onclick="copySpeechText('speech-patch', this)" class="text-xs text-gray-500 hover:text-pf-red font-semibold flex items-center gap-1 bg-gray-50 hover:bg-red-50 px-2.5 py-1 rounded-lg transition-colors">
                                    <i class="ph ph-copy"></i> Copiar
                                </button>
                            </div>
                            <p id="speech-patch" class="text-xs sm:text-sm text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100 font-mono">
                                "Registramos la solicitud de cambio de Patch Cord (cable amarillo de fibra). Costo: S/ 60 en [1, 2 o 3] cuotas sin intereses. Plazo: 24 horas. ¿Está de acuerdo con la solicitud?"
                            </p>
                        </div>
                    </div>

                    <!-- Pestaña 5: Suspensión Temporal -->
                    <div id="vozTab-suspension" class="voz-tab-content hidden space-y-4">
                        <h4 class="font-bold text-gray-800 text-sm sm:text-base flex items-center gap-2">
                            <i class="ph-bold ph-pause-circle text-pf-red"></i> Speech para Suspensión Temporal
                        </h4>

                        <div class="border border-gray-200 rounded-2xl p-4 bg-white shadow-sm space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 bg-amber-100 text-amber-800 font-bold text-xs rounded-full">SUSPENSIÓN TEMPORAL (15 A 60 DÍAS)</span>
                                <button onclick="copySpeechText('speech-suspension', this)" class="text-xs text-gray-500 hover:text-pf-red font-semibold flex items-center gap-1 bg-gray-50 hover:bg-red-50 px-2.5 py-1 rounded-lg transition-colors">
                                    <i class="ph ph-copy"></i> Copiar
                                </button>
                            </div>
                            <p id="speech-suspension" class="text-xs sm:text-sm text-gray-700 bg-gray-50 p-3.5 rounded-xl border border-gray-100 leading-relaxed font-mono">
                                "Estimado(a) [Nombre del Titular], procedemos a registrar la suspensión temporal de su servicio desde el día [Fecha de Inicio] hasta el [Fecha de Fin] (plazo de [N°] días). Le recordamos que durante este periodo su servicio estará pausado sin cobros, y la reactivación será automática al término del plazo. ¿Se encuentra usted de acuerdo?"
                            </p>
                            <div class="text-xs text-gray-500 bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                                <strong>⚠️ Nota:</strong> No programar suspensiones para domingos (si llama sábado, programar para el lunes). Plazo de aplicación: 48 horas.
                            </div>
                        </div>
                    </div>
                </div>
            `;

            openModal(title, contentHtml);
        }

        // Tab switcher inside Acuerdos de Voz modal
        function switchVozTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.voz-tab-content').forEach(el => el.classList.add('hidden'));
            
            // Remove active classes on all tab buttons
            document.querySelectorAll('.voz-tab-btn').forEach(btn => {
                btn.classList.remove('bg-pf-red', 'text-white', 'shadow-sm');
                btn.classList.add('bg-gray-100', 'text-gray-700');
            });

            // Show selected tab content
            const targetContent = document.getElementById(`vozTab-${tabName}`);
            if (targetContent) targetContent.classList.remove('hidden');

            // Activate button
            const activeBtn = document.getElementById(`tabBtn-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-gray-100', 'text-gray-700');
                activeBtn.classList.add('bg-pf-red', 'text-white', 'shadow-sm');
            }
        }

        // Copy helper for speech text
        function copySpeechText(elementId, btnElement) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const textToCopy = el.innerText.trim();
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="ph-bold ph-check text-green-600"></i> <span class="text-green-600">¡Copiado!</span>`;
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                }, 2000);
            }).catch(err => {
                console.error('Error al copiar texto:', err);
            });
        }

        function handleLightboxEsc(e) {
            if (e.key === 'Escape') {
                closeImageLightbox();
            }
        }
</script>



    <!-- Global Modal -->

    <div id="globalModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity duration-300 opacity-0" onclick="if(event.target === this) closeModal()">

        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col m-4 transform scale-95 transition-transform duration-300 overflow-hidden">

            <!-- Modal Header -->

            <div class="bg-white px-6 py-5 border-b border-gray-100 flex justify-between items-center shrink-0">

                <h3 id="globalModalTitle" class="text-xl md:text-2xl font-bold text-gray-900 flex items-center"></h3>

                <button onclick="closeModal()" class="text-gray-400 hover:text-pf-red transition-colors bg-gray-50 hover:bg-red-50 rounded-full p-2 flex-shrink-0 focus:outline-none">

                    <i class="ph ph-x text-xl"></i>

                </button>

            </div>

            <!-- Modal Content -->

            <div id="globalModalContent" class="p-6 md:p-8 overflow-y-auto bg-white flex-1">

            </div>

        </div>

    </div>


    <!-- ================================================== -->
    <!-- VISOR AMPLIADO DE IMÁGENES (LIGHTBOX MODAL) -->
    <!-- ================================================== -->
    <div id="imageLightboxModal" class="fixed inset-0 z-[100] hidden opacity-0 transition-opacity duration-300 bg-black/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 md:p-6" onclick="if(event.target === this || event.target.id === 'lightboxScrollContainer') closeImageLightbox()">
        
        <!-- Barra superior flotante de herramientas del Visor -->
        <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-[110] flex items-center gap-2">
            <!-- Botón Pantalla Completa / Abrir archivo -->
            <a id="lightboxNewTabBtn" href="#" target="_blank" class="flex items-center gap-1.5 px-3.5 py-2 bg-white/10 hover:bg-white/25 text-white backdrop-blur-md rounded-xl text-xs sm:text-sm font-semibold border border-white/20 transition-all shadow-lg hover:scale-105" title="Abrir en pestaña nueva / resolución original">
                <i class="ph-bold ph-arrow-square-out text-base"></i>
                <span class="hidden sm:inline">Ver original</span>
            </a>
            
            <!-- Botón Cerrar (X) -->
            <button onclick="closeImageLightbox()" class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-white/15 hover:bg-red-600 text-white backdrop-blur-md border border-white/25 flex items-center justify-center transition-all shadow-lg hover:scale-110 cursor-pointer focus:outline-none" title="Cerrar visor (ESC)">
                <i class="ph-bold ph-x text-xl sm:text-2xl"></i>
            </button>
        </div>

        <!-- Título flotante superior -->
        <div class="fixed top-4 left-4 sm:top-6 sm:left-6 z-[110] max-w-[70vw] sm:max-w-md pointer-events-none">
            <div class="bg-black/60 backdrop-blur-md px-4 py-2 rounded-xl border border-white/15 shadow-lg">
                <h4 id="lightboxImageTitle" class="text-white font-bold text-xs sm:text-sm md:text-base truncate flex items-center gap-2">
                    <i class="ph-fill ph-file-image text-pf-red"></i>
                    <span>Visor de Documento</span>
                </h4>
                <p id="lightboxImageSubtitle" class="text-gray-300 text-[11px] sm:text-xs hidden truncate"></p>
            </div>
        </div>

        <!-- Contenedor con Scroll y Centrado -->
        <div id="lightboxScrollContainer" class="w-full h-full max-w-[96vw] max-h-[92vh] flex items-center justify-center overflow-auto p-1 sm:p-3">
            <div id="lightboxInnerContainer" class="relative transform scale-95 transition-transform duration-300 flex items-center justify-center max-w-full max-h-full">
                <img id="lightboxImage" src="" alt="Documento Ampliado" class="w-auto h-auto max-w-[90vw] max-h-[88vh] md:max-h-[90vh] rounded-2xl object-contain shadow-2xl border border-white/15 select-none bg-white/5" />
            </div>
        </div>

        <!-- Pie flotante de ayuda / atajos -->
        <div class="fixed bottom-4 inset-x-0 z-[110] flex justify-center pointer-events-none">
            <div class="bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 text-gray-300 text-[11px] sm:text-xs font-medium flex items-center gap-3 shadow-lg">
                <span class="flex items-center gap-1"><i class="ph-bold ph-cursor-click"></i> Clic fuera para cerrar</span>
                <span>•</span>
                <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-white/20 rounded text-[10px] text-white">ESC</kbd> para salir</span>
            </div>
        </div>
    </div>
